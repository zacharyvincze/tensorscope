[project]
name = "tensorscope"
version = "0.1.0"
description = "Visual debugger for tensorscope capture bundles"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
tensorscope = "tensorscope_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorscope_viewer"]
